[project]
name = "rabbitears"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Taylor", email = "90michaeltaylor@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
rabbitears = "rabbitears:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "taskipy>=1.14.1",
]

# Common tasks: `uv run task --list`, `uv run task <name> [extra args]`.
# Rule: every task that changes a target (VM/box) goes through the repo's
# idempotent scripts (provision.sh, deploy.sh, setup.sh). There is deliberately
# no task for running ad-hoc commands on a target.
[tool.taskipy.settings]
cwd = "."   # run from the repo root regardless of where `task` is invoked

[tool.taskipy.tasks]
test = { cmd = "python -m unittest discover tests/ -v", help = "Run the full unit test suite" }
unit = { cmd = "python -m unittest", help = "Run specific tests, e.g. task unit tests.test_schedule" }
setup-sudoers = { cmd = "./vm/setup-sudoers.sh", help = "One-time per clone: passwordless sudo for the VM root scripts" }
vm-proxy = { cmd = "./vm/provision.sh proxy", help = "Start the apk caching proxy (idempotent)" }
pre_vm-build = "task vm-proxy"
vm-build = { cmd = "./vm/provision.sh", help = "Build the VM from the pinned Alpine ISO (idempotent)" }
pre_vm-rebuild = "task vm-proxy"
vm-rebuild = { cmd = "./vm/provision.sh destroy && ./vm/provision.sh", help = "Destroy and rebuild the VM from scratch (the reproducibility check)" }
vm-status = { cmd = "./vm/provision.sh status", help = "Show VM, ISO and disk status" }
vm-run = { cmd = "python vm/vmctl.py run", help = "Boot the VM in QEMU and stream its serial console" }
vm-serial = { cmd = "python vm/vmctl.py serial", help = "Attach to the running VM's serial console" }
vm-shot = { cmd = "python vm/vmctl.py screenshot", help = "Screenshot the running VM to vm/screenshot.png" }
vm-stop = { cmd = "python vm/vmctl.py stop && ./vm/provision.sh stop", help = "Stop the VM (vmctl QEMU + libvirt domain) and verify no QEMU still holds the disk" }
vm-install-log = { cmd = "tail -n 60 /var/lib/rabbitears-vm/install-serial.log", help = "Show the end of the last base install's serial transcript (where vm-build hung/failed)" }
vm-e2e = { cmd = "python vm/e2e.py", help = "End-to-end check: boot VM + stick, deploy, verify mount/playback/schedule/unplug/replug/crash (append --rebuild for a fresh VM)" }
deploy-vm = { cmd = "alpine/deploy.sh --vm --reboot", help = "Deploy the repo to the VM, reboot, and verify" }
vm-verify = { cmd = "alpine/verify.sh --vm", help = "Read-only drift check against the VM" }
deploy-box = { cmd = "alpine/deploy.sh --commit --reboot", help = "Deploy to a box (append --host H); commits + reboots" }
box-verify = { cmd = "alpine/verify.sh", help = "Read-only drift check against a box (append --host H)" }
transcode = { cmd = "tools/transcode.sh", help = "Transcode media to SCOPE §5 compliance (append SRC_DIR DEST_DIR)" }
media-check = { cmd = "tools/transcode.sh --check", help = "Check media files for SCOPE §5 compliance (append DIR)" }
usb-build = { cmd = "./vm/make-usb.sh", help = "Build the mock USB stick image from the staging dir (append --reformat / --reset-state)" }
vm-run-usb = { cmd = "python vm/vmctl.py run --usb /var/lib/rabbitears-vm/usb.img", help = "Boot the VM in QEMU with the mock USB stick attached" }
vm-run-usb-spice = { cmd = "python vm/vmctl.py run --usb /var/lib/rabbitears-vm/usb.img --display spice", help = "Boot the VM with the stick + a live SPICE display (connect: spice://127.0.0.1:5910)" }
vm-run-usb-vnc = { cmd = "python vm/vmctl.py run --usb /var/lib/rabbitears-vm/usb.img --display vnc", help = "Boot the VM with the stick + a live VNC display (connect: vnc://127.0.0.1:5901)" }
vm-run-usb-vnc-remote = { cmd = "python vm/vmctl.py run --usb /var/lib/rabbitears-vm/usb.img --display vnc --remote-usb 0627:697d", help = "Boot the VM with the stick + VNC + the REAL Adomax dongle passed through (plug it in first)" }
vm-watch = { cmd = "./vm/watch.sh", help = "Open the Remmina viewer on the running VM's VNC display (then drive it with the physical remote)" }
usb-unplug = { cmd = "python vm/vmctl.py usb unplug", help = "Hot-unplug the mock USB stick from the running VM" }
usb-plug = { cmd = "python vm/vmctl.py usb plug", help = "Re-insert the mock USB stick into the running VM" }
vm-key = { cmd = "python vm/vmctl.py key", help = "Press a remote button in the VM (append BUTTON [--hold S]; e.g. up, volup, power, left)" }
remote-unplug = { cmd = "python vm/vmctl.py remote unplug", help = "Hot-unplug the emulated remote (usb-kbd) from the running VM" }
remote-plug = { cmd = "python vm/vmctl.py remote plug", help = "Re-insert the emulated remote (usb-kbd) into the running VM" }
vm-powerbutton = { cmd = "python vm/vmctl.py powerbutton", help = "Press the ACPI power button in the VM (QMP system_powerdown)" }
