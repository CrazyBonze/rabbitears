# Rabbit Ears — mpv config for the Dell Wyse 3040 (Cherry Trail / Gen8 VAAPI).
# Installed to /etc/mpv/mpv.conf by alpine/setup.sh.
#
# The app (src/rabbitears/player.py) drives this single long-running mpv over
# the JSON IPC socket; channel changes are `loadfile ... start=<offset>`, not
# a process restart (SCOPE §4.3).

# --- Video: DRM output via the GPU (no X11/Wayland) ---
vo=gpu
gpu-context=drm
# Hardware decode on the Intel i965 VAAPI driver (Cherry Trail is Gen8).
hwdec=vaapi
# Render to the panel's native mode; the DP->HDMI->composite chain handles the
# rest. Keep it simple — no scaling tricks the 3040 can't do reliably.
gpu-scale=none

# --- Audio: ALSA ---
ao=alsa
# TODO: pin the exact ALSA device (e.g. audio-device=hw:0,0) once the audio
#       path is confirmed on the real box — HDMI vs headphone jack (SCOPE §11).

# --- OSD: large, thick, high-contrast (readable over composite on a CRT) ---
# The green channel flash is drawn by the app, not mpv's OSD; these are the
# fallback styling for mpv's own OSD (info overlay, etc.).
osd-font-size=10
osd-color=#33CC33
osd-border-size=3
osd-shadow-color=#000000
osd-shadow-offset=1
osd-bar=no

# --- Behaviour: no interaction, no on-screen clutter ---
input-default-bindings=no
cursor-autohide=no
keep-open=no
loop-file=no
# Never drop to a menu/error dialog — the app owns all viewer-facing state.
ytdl=no

# --- Control: JSON IPC socket (used by src/rabbitears/player.py) ---
ipc=/run/rabbitears/mpv.sock
